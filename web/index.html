  <script type="module">
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDajmD1rRk4N6hg1MfRvy6d78t5b6s_S7Q",

    projectId: "we-source-you",

  const app = firebase.initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  // طلب صلاحية الإشعارات

    if (permission === 'granted') {
      console.log("Notification permission granted.");

        // ممكن تخزن الـ token في Firestore للـ user الحالي
      });
    } else {
      console.log("User denied notifications");
    }
  });

  // استماع للإشعارات الواردة أثناء فتح الصفحة
  onMessage(messaging, (payload) => {
    console.log("Message received: ", payload);
    // هنا ممكن تعمل Local Notification عبر JS أو Flutter interop
  });
</script>
